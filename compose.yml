services:
  web:
    build: .
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  preview:
    profiles: [preview]
    build: .
    ports:
      - '4173:4173'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm run build && npm run preview -- --port 4173"

volumes:
  web_node_modules:
